<text x="432.5" y="463" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.5" fill="#b35900" text-anchor="middle" font-weight="normal" font-style="italic">요청당 timeout 5s, 요청 간 최소간격 1000ms (rate limiter)</text>
