<text x="432.5" y="560" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.5" fill="#1e7d32" text-anchor="middle" font-weight="normal" font-style="italic">실측(turtle 300경기, 위 summaries호출부터 여기까지 두 호출 합산, 복수측정 평균): 캐시 미스 약 5.1~5.3s / 캐시 히트 약 6~55ms(편차 큼)</text>
