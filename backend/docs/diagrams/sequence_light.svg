<text x="657.5" y="933" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.5" fill="#1e7d32" text-anchor="middle" font-weight="normal" font-style="italic">실측(LLM 단독, stats 캐시 워밍 후 TETR.IO 제외하고 분리측정): 약 20ms</text>
