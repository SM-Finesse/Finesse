<rect x="300.0" y="953" width="715" height="62" fill="#fbfbf5" stroke="#1e7d32" stroke-width="1.1"/>
<text x="657.5" y="971" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.8" fill="#1e7d32" text-anchor="middle" font-weight="normal" font-style="italic">실측(mock 서버, 캐시 미스 기준): 프론트 요청부터 응답까지 전체 약 5.3~6.3s (거의 TETR.IO 조회 시간, LLM은 위처럼 단독 약 20ms)</text>
<text x="657.5" y="987" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.8" fill="#1e7d32" text-anchor="middle" font-weight="normal" font-style="italic">실패 시나리오: highlights&lt;3 3회 지속 → 502 LLM_FORMAT_ERROR / 3회 모두 연결실패 → 503 LLM_UNAVAILABLE</text>
<text x="657.5" y="1003" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.8" fill="#1e7d32" text-anchor="middle" font-weight="normal" font-style="italic">실측(서버 다운 상황, 3회 재시도 모두 연결거부): 약 4.67s만에 503 응답</text>
