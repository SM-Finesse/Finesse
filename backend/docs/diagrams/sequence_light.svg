<text x="432.5" y="304" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.5" fill="#b35900" text-anchor="middle" font-weight="normal" font-style="italic">타임아웃 5s (tetrio.request-timeout-seconds) / 실측치는 아래 records 호출과 합산해 표기</text>
