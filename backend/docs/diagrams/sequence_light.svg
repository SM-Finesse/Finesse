<text x="657.5" y="836" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.5" fill="#b35900" text-anchor="middle" font-weight="normal" font-style="italic">요청당 timeout 20s (llm.light-request-timeout-seconds, 2026-09-21 정책 결정)</text>
