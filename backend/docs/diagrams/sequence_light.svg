<text x="545.0" y="719" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="11.5" fill="#1e7d32" text-anchor="middle" font-weight="normal" font-style="italic">인메모리 연산, 별도 timeout 없음 — 추정 &lt;10ms(별도 격리측정 안함, 전체/TETR.IO구간 차이로 역산)</text>
<line x1="320" y1="819" x2="995" y2="819" stroke="#333333" stroke-width="1.6"/>
<line x1="320" y1="819" x2="995" y2="819" stroke="transparent" stroke-width="10" marker-end="url(#arrowFilled)"/>
