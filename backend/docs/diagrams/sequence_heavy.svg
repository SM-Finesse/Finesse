<text x="620.0" y="861" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="10.8" fill="#b35900" text-anchor="middle" font-weight="normal" font-style="italic">* 8개 챗터는 스레드풀에서 비동기 병렬 실행됨. AtomicInteger 라운드로빈 카운터 덕분에 서버당 정확히 4개씩 배정되는 것은 보장되지만,</text>
<text x="620.0" y="876" font-family="Malgun Gothic, 'Segoe UI', sans-serif" font-size="10.8" fill="#b35900" text-anchor="middle" font-weight="normal" font-style="italic">  어느 챗터가 몇 번째로 어느 서버에 가는지(=라운드 구성)는 스레드 스케줄링에 따라 달라질 수 있음 — 아래는 대표 예시</text>
