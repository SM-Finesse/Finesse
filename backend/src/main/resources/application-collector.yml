# collector 프로파일 — 학습 데이터 수집 서버 (학습 데이터 수집 서버 작업지시서 5절).
# 서비스 설정(application.yml)은 그대로 두고 이 파일로만 덮어쓴다. 실행: --spring.profiles.active=collector
spring:
  main:
    web-application-type: none   # 웹 서버를 띄우지 않는다 — 프론트와 통신하지 않는 수집 전용
  config:
    # 수집 폴더의 로컬 설정 — LLM 서버 실제 주소(collector.llm.servers)는 레포에 넣지 않고 여기 둔다(10/27). 없으면 무시
    import: optional:file:${collector.data-dir:${user.home}/finesse-collector}/collector-local.yml

llm:
  servers: []                    # 1번 서비스용 LLM 클라이언트는 쓰지 않는다 — 수집기 코멘트는 collector.llm.servers

collector:
  # 🔴 레포 밖 — targets.csv·user_map.csv(닉네임)가 여기 있다. 복원 프로그램이 지우지 않는 곳으로 바꿔 실행(4.8절)
  data-dir: ${user.home}/finesse-collector
  targets-file: ${collector.data-dir}/targets.csv
  interval-seconds: 60            # 직전 수집이 끝난 뒤 1분(4.2절)
  rate-limited-interval-seconds: 300   # 429 뒤 5분(4.6절)
  max-consecutive-failures: 3     # 연속 3회 실패면 쉰다(4.6절 — 중단 대신 쉬고 재개, PM 확인 10/13)
  failure-pause-seconds: 600      # 연속 실패 뒤 10분 쉬고 이어서 — 쉬고 나서 첫 유저도 실패면 바로 다시 10분. 0이면 원래대로 중단
  slow-user-warn-seconds: 30      # 유저 1명 수집이 30초를 넘으면 경고 로그
  # LLM 코멘트(10/27) — 라이트 개별·기본 + 헤비 챕터 7개를 받아 JSON에 함께 저장.
  # servers가 비어 있으면 받지 않는다. 실제 주소는 수집 폴더의 collector-local.yml에:
  #   collector:
  #     llm:
  #       servers: [http://(LLM 서버 1):8081, http://(LLM 서버 2):8081]
  llm:
    servers: []
    call-timeout-seconds: 10      # LLM 서버가 9초 안에 응답(강제 마감)
    connect-timeout-seconds: 2
    fallback-retries: 1           # 대체 문장(fallback: true)이면 같은 요청을 1회 더

logging:
  file:
    name: ${collector.data-dir}/logs/collector.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  level:
    root: INFO
