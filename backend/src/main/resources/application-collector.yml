# collector 프로파일 — 학습 데이터 수집 서버 (학습 데이터 수집 서버 작업지시서 5절).
# 서비스 설정(application.yml)은 그대로 두고 이 파일로만 덮어쓴다. 실행: --spring.profiles.active=collector
spring:
  main:
    web-application-type: none   # 웹 서버를 띄우지 않는다 — 프론트·LLM과 통신하지 않는 수집 전용

llm:
  servers: []                    # LLM은 부르지 않는다(3.2절)

collector:
  # 🔴 레포 밖 — targets.csv·user_map.csv(닉네임)가 여기 있다. 복원 프로그램이 지우지 않는 곳으로 바꿔 실행(4.8절)
  data-dir: ${user.home}/finesse-collector
  targets-file: ${collector.data-dir}/targets.csv
  interval-seconds: 60            # 직전 수집이 끝난 뒤 1분(4.2절)
  rate-limited-interval-seconds: 300   # 429 뒤 5분(4.6절)
  max-consecutive-failures: 3     # 연속 3회 실패면 중단(4.6절)

logging:
  file:
    name: ${collector.data-dir}/logs/collector.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  level:
    root: INFO
