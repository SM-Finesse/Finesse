server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: finesse-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

# TETR.IO 외부 API 설정 (Finesse-API명세서 4.1-1절, TETR.IO API 연동확인 문서 기준)
# 타임아웃/재시도 값은 타임아웃 기준 문서(23번) 9절을 정본으로 한다.
tetrio:
  base-url: https://ch.tetr.io/api
  request-timeout-seconds: 5
  # 호출 간격은 calc와 같은 RateLimiter를 쓴다 — finesse.analytics.collector.min-request-interval (10/7)
  retry: 2 # 최초 포함 총 3회 — calc 모듈 max-retry-attempts(3)와 맞춤 (팀 검토 2026-10-01)

# LLM 추론 서버 목록 (Finesse-API명세서 6장/6.1절 — 라운드로빈 대상)
# MVP: 학교 PC 8대 중 2대. 여기 값은 로컬 개발용 mock LLM(tools/MockLlmServer.java, 9101/9102) —
# 실제 추론 서버 주소는 저장소에 넣지 않고 실행할 때 --llm.servers=... 로 지정한다.
# "호출 1회"와 "엔드포인트"는 다른 레이어 — 엔드포인트 상한은 app.endpoint 아래에 따로 둔다.
llm:
  servers:
    - http://localhost:9101
    - http://localhost:9102
  connect-timeout-seconds: 2        # 연결 타임아웃 — 넘으면 "연결 실패"로 보고 서버 제외 대상 (5.5절)
  heavy-call-timeout-seconds: 10   # heavy 챕터 1회 호출 (9/22 Vulkan 실측 기준)
  heavy-min-remaining-seconds: 5   # heavy 새 시도 시작 조건 — 엔드포인트 잔여시간이 이보다 적으면 재시도 안 함
  light-call-timeout-seconds: 15   # light 1회 호출
  light-min-remaining-seconds: 12  # light 새 시도 시작 조건
  max-retries: 3                    # 최초 시도 포함 총 4회 (표5)
  server-exclude-seconds: 30        # 연결 실패한 서버를 이 시간 동안 라운드로빈에서 제외 (5.5절)
  light-path: /v1/comment/light            # 예전 한 번 호출 경로 — 11/9부터 서비스에서 부르지 않음(light-comment 참고)
  heavy-chapter-path: /v1/comment/heavy-chapter   # LLM 쪽 heavy 엔드포인트가 나오면 확인
  # 라이트 개별·기본 코멘트 (LLM light-v5.2, 10/21) — calc가 고른 지표마다 개별 1회 + 기본 1회를 동시에 부른다.
  # enabled: false이거나 calc가 고른 지표가 없으면 LLM을 부르지 않고 하이라이트 없이 응답한다.
  # 예전 light-path 한 번 호출은 11/9부터 쓰지 않는다(파인튜닝 모델이 그 형식을 학습하지 않아 품질이 무너짐 — LLM 요청).
  light-comment:
    enabled: true
    sentence-path: /v1/light/sentence
    summary-path: /v1/light/summary
    call-timeout-seconds: 10       # 호출 1회 — LLM 서버가 받은 시각부터 9초 안에 응답(강제 마감)
    min-remaining-seconds: 10      # 다른 서버로 다시 부르려면 light 엔드포인트(40초)에 남아 있어야 하는 시간

# 캐시 설정 (Finesse-API명세서 5장 — 인메모리 Caffeine, 최대 10분 유지 후 소멸)
app:
  cache:
    ttl-minutes: 10
  # 트래픽 몰림(23번 5.4절) — 캐시 미스 수집은 동시에 2건까지만.
  # 유저 1명 TETR.IO 최대 8회 × 1초 간격 → 2명이면 약 16초로 stats 20초 마감 안.
  stats:
    max-concurrent-collections: 2
    busy-retry-after-seconds: 5
    # 자리가 없으면 최대 6초 차례를 기다리고(도착 순서대로), 이미 2명이 기다리고 있으면 바로 503 SERVER_BUSY.
    # 기다린 시간은 stats 20초 마감 안에서 쓴다.
    max-queue-wait-seconds: 6
    max-waiting: 2
  # 엔드포인트(요청 하나를 끝내야 하는 마감) 레벨 타임아웃 — 타임아웃 기준 문서(23번) 9절.
  # heavy는 LLM 서버 대수에 따라 CommentService가 heavy-seconds/heavy-single-server-seconds 중 하나를 고른다.
  endpoint:
    stats-seconds: 20
    light-seconds: 40
    heavy-seconds: 60
    heavy-single-server-seconds: 120
  # 전적 검색 대기열 — 「전적 검색 대기열 문서」 6절. 기본은 꺼 둔다(지금 동작 그대로: 요청 안 대기 6초·2명, 넘으면 503, LLM 라이트 먼저).
  # 202를 모르는 지금 프론트는 202 본문을 결과로 읽으려다 깨질 수 있으므로 프론트 대기 화면이 들어간 뒤 켤 것(FINESSE_QUEUE_ENABLED=true).
  # 켜면 app.stats.max-queue-wait-seconds(6초)는 "요청 안에서 기다리다 대기표로 바꾸는 한도"로만 쓰고 max-waiting은 쓰지 않는다.
  queue:
    enabled: ${FINESSE_QUEUE_ENABLED:false}
    inline-wait-seconds: 5           # 예상 대기가 이 값 이하면 요청 안에서 기다림, 넘으면 202 + 대기표
    max-wait-seconds: 180            # 줄 상한 — 예상 대기가 넘으면 503 SERVER_BUSY(Retry-After = 예상 대기, 최대 60초)
    ticket-idle-seconds: 30          # 이 시간 동안 상태를 묻지 않은 대기표는 버림
    poll-after-seconds: 2            # poll_after_seconds 기본값(줄이 길면 최대 max-poll-after-seconds)
    max-poll-after-seconds: 5
    done-retention-seconds: 120      # 끝난 대기표를 지우기까지
    prefetch-light: true             # 대기열로 수집이 끝나면 라이트 코멘트를 같은 순서로 미리 만듦
    light-inline-wait-seconds: 15    # LLM 예상 대기가 이 값 이하면 light를 요청 안에서(40 − 내 처리 15 − 재호출 여유 10)
    heavy-inline-wait-seconds: 30    # LLM 예상 대기가 이 값 이하면 heavy를 바로 SSE로, 넘으면 event: queued
    # 한 IP가 동시에 가질 수 있는 대기표(0 = 제한 없음). X-Real-IP 기준.
    # nginx가 CF-Connecting-IP를 X-Real-IP로 넘기기 전에는 터널을 거친 모든 사용자가 한 IP로 보이므로 0으로 켤 것(5.5절).
    # 발표 날처럼 한 와이파이(외부 IP 1개)에 사람이 몰리는 날도 0.
    max-tickets-per-ip: ${FINESSE_QUEUE_MAX_TICKETS_PER_IP:3}
    refresh-min-interval-seconds: 60 # 마지막 갱신 후 이 시간 안의 refresh=true는 줄을 세우지 않고 캐시 반환(0 = 끔)
    initial-interval-seconds: 5      # 수집 완료 간격 이동 평균의 처음값
    interval-alpha: 0.3
    max-retry-after-seconds: 60
    initial-light-call-seconds: 1.5  # LLM 호출 1회 처리 시간 이동 평균의 처음값 — 11/18 실제 LLM 실측(light 약 1.5초)
    initial-heavy-call-seconds: 3.5  # heavy 챕터 약 3.4초. 짧게 잡으면 켜자마자 몰린 heavy를 너무 많이 요청 안으로 받는다
    # 테스트 전용 처리 간격 고정(test-fixed-interval-seconds)은 여기 두지 않는다 — application-queue-test.yml(프로파일 queue-test)에만

# data-eng calc 모듈(StatCalculatorFacade) 설정 — 값은 data-eng 테스트 기준값
# max-retry-attempts: 최초 포함 총 3회, 페이지당 100판(max-matches-per-page) — 데이터 엔지니어 검토(2026-10-01)
finesse:
  analytics:
    cold-start-threshold: 10
    max-match-window: 300
    recent-win-loss-window: 40
    collector:
      base-url: https://ch.tetr.io/api
      min-request-interval: 1s
      max-pages: 3
      max-matches-per-page: 100
      max-age-days: 365
      min-partial-matches: 30
      max-retry-attempts: 3
      request-timeout: 5s
      session-refresh-timeout: 5s

logging:
  level:
    com.finesse.backend: DEBUG
